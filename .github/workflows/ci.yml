name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # A stylesheet with a missing brace still builds, but esbuild warns and every rule
      # after it is lost. Fail the build on any such warning.
      - name: Build (fails on CSS warnings)
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -q '\[WARNING\]' build.log; then
            # Repeat each warning with its context so the cause is at the end of the log.
            grep -A 12 '\[WARNING\]' build.log
            echo "::error::The build printed warnings (often a missing } in a CSS file). See above."
            exit 1
          fi
